name: My test CI

on: 
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup python
      uses: actions/setup-python@v5
      with: 
        python-version:"3.11"

    - name: Install libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requerments.txt

    - name: Run Tests
      run: |
        pytest